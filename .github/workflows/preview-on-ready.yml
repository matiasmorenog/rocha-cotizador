name: Preview on ready

# Single preview path for feature PRs: Actions builds via Vercel CLI.
# Git integration previews on rocha-cotizador are cancelled (ignore script) to
# avoid duplicate builds with Vercel – rocha-cotizador checks.
permissions:
  contents: read

on:
  pull_request:
    branches: [development, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-on-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  vercel-preview:
    name: vercel-preview
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview env
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

      - name: Build preview
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt preview
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "preview_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Preview URL: ${url}"

      - name: Job summary
        run: |
          {
            echo "### Vercel preview deployed"
            echo ""
            echo "- Branch: \`${PR_HEAD_REF}\`"
            echo "- Commit: \`${PR_HEAD_SHA:0:7}\`"
            echo "- URL: ${{ steps.deploy.outputs.preview_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
