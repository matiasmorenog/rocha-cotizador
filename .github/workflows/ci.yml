name: CI

on:
  pull_request:
    branches: [development, main]
    # ready_for_review: re-run when a draft PR is marked ready
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    # Draft PRs: skip (save Actions minutes). Push to development/main still runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guard admin desktop sidebar: class must live in globals.css (not Tailwind
      # `hidden lg:block`, which can vanish from the prod CSS singleton chunk).
      - name: Admin chrome guards
        run: npm run ci:check-admin-chrome
