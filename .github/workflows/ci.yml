name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Guard admin desktop sidebar: class must live in globals.css (not Tailwind
      # `hidden lg:block`, which can vanish from the prod CSS singleton chunk).
      - name: Admin chrome guards
        run: npm run ci:check-admin-chrome

  # Production only: never deploy main unless lint/typecheck passed.
  # Vercel auto-deploy on `main` is disabled in vercel.json — this job is the gate.
  deploy-production:
    name: deploy-production
    needs: lint-and-typecheck
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      AUTH_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production env
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Schema gate BEFORE build/deploy: code must not ship ahead of Neon main.
      # Prefer secret DATABASE_URL_PRODUCTION; else load DATABASE_URL from vercel pull.
      - name: Pre-deploy schema sync gate
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          chmod +x scripts/check-schema-sync.sh
          if [[ -n "${DATABASE_URL_PRODUCTION:-}" ]]; then
            export DATABASE_URL="$DATABASE_URL_PRODUCTION"
            echo "Using GitHub secret DATABASE_URL_PRODUCTION for schema gate"
          else
            ENV_FILE=".vercel/.env.production.local"
            if [[ ! -f "$ENV_FILE" ]]; then
              echo "error: missing $ENV_FILE after vercel pull, and no DATABASE_URL_PRODUCTION secret." >&2
              echo "Add Actions secret DATABASE_URL_PRODUCTION (Neon main, preferably direct URL)." >&2
              exit 1
            fi
            export DATABASE_URL="$(node scripts/read-vercel-database-url.js "$ENV_FILE")"
            echo "Using DATABASE_URL from vercel pull (production)"
          fi
          bash scripts/check-schema-sync.sh

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Post-deploy smoke
        run: |
          chmod +x scripts/post-deploy-smoke.sh
          npm run ci:post-deploy-smoke
